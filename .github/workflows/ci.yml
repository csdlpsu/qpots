name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,docs]"

      - name: Run tests
        run: python -m pytest -q tests/

  acceptance:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,docs,examples]" build twine

      - name: Check maintained code and examples
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q examples

      - name: Build documentation without warnings
        run: python -m sphinx -W -b html docs/source docs/build/html

      - name: Build and validate distributions
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*
          python tools/verify_distribution.py dist

      - name: Smoke-test the installed wheel
        run: |
          python -m pip uninstall -y qpots
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import qpots

          package_file = Path(qpots.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          expected_version = tomllib.loads((workspace / "pyproject.toml").read_text())["project"][
              "version"
          ]
          assert qpots.__version__ == expected_version
          assert qpots.QPOTSRunner
          assert not package_file.is_relative_to(workspace), package_file
          PY
          python "${GITHUB_WORKSPACE}/examples/constrained_example.py" \
            --quick --output-dir "${RUNNER_TEMP}/weldedbeam"
          python "${GITHUB_WORKSPACE}/examples/decoupled_osy_example.py" \
            --quick --output-dir "${RUNNER_TEMP}/osy"
          python "${GITHUB_WORKSPACE}/examples/custom_function_example.py" \
            --quick --output "${RUNNER_TEMP}/cantilever.png"
          python "${GITHUB_WORKSPACE}/examples/decoupled_branin_currin_figure.py" \
            --quick --output "${RUNNER_TEMP}/decoupled.png"

      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: |
            dist/*
            docs/build/html/
          if-no-files-found: error
          retention-days: 7
